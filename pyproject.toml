[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aros-s"
version = "0.1.2"
description = "AROS-S Satellite Autonomous Telemetry Security Anomaly Detector"
dependencies = [
    "pandas",
    "numpy",
    "onnxruntime",
    "scikit-learn",
    "huggingface_hub"
]

[project.urls]
Repository = "https://github.com/zlatimirpetrov/AROS-S-Autonomous-Real-time-On-board-Security-for-Satellites"