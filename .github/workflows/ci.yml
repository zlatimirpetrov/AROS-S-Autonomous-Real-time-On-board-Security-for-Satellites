name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build data and models from scratch
        run: |
          python src/prepare_data.py        # synthetic nominal telemetry + scaler
          python src/nasa_smap_raw.py       # sample NASA SMAP data
          python src/recalibrate.py         # scaler + forests + autoencoder (multi-regime)
          python src/train_temporal.py      # temporal window autoencoder
          python src/convert_to_onnx.py     # export all five models to ONNX

      - name: Run tests (incl. joblib <-> ONNX equivalence)
        run: pytest -q
